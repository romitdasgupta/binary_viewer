# nginx reverse proxy for BinaryStudio in public mode (alternative to the Caddyfile).
# Include from the `http { }` block, e.g. /etc/nginx/conf.d/binarystudio.conf.
#
# Start the app on loopback with:
#   python3 binary_viewer.py --public --trust-proxy --allowed-host binarystudio.example.com
#
# Replace binarystudio.example.com and the certificate paths.
# Written for nginx >= 1.25.1 (`http2 on;`). On older versions use
# `listen 443 ssl http2;` instead; `ssl_reject_handshake` needs >= 1.19.4.

# Who enforces what. The app does not rely on nginx for any limit:
#
#   the app (all on by default with --public)
#     - requests in progress per client address (the one nginx forwards), connections in total
#     - request rate per client, stricter for uploads and patches, and by response size
#     - upload size; memory for uploads in flight, in total and per client; a
#       first-byte deadline and a minimum rate for request bodies
#     - response bytes in flight, in total and per client; readers that stall are cut off
#     - analysis time and memory (worker processes, killed on overrun), concurrency
#     - Host allowlist, cross-site refusal, strict header parsing, security headers
#   nginx (this file; a second line of defence, and cheaper to refuse here)
#     - TLS, HTTP/2 towards browsers
#     - limit_req / limit_conn per address, body size ceiling, client timeouts
#     - buffering whole uploads and responses, so a slow client occupies nginx
#     - keeping document ids out of its logs (see log_format and error_log below)
#
# Coarse limits at the edge; the app enforces its own per-client limits as well.
limit_req_zone  $binary_remote_addr zone=binarystudio_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=binarystudio_conn:10m;

# $uri carries no query string. Uploaded files are addressed by an unguessable
# id; whoever holds it can read the file until it expires. The web UI sends ids
# in request headers (X-BS-Doc, X-BS-Doc-A, X-BS-Doc-B), which nginx never logs;
# older clients and hand-written URLs put them in the query (?doc=u_..., ?a=, ?b=),
# so the default "combined" format (which logs $request) is not used.
log_format binarystudio '$remote_addr [$time_iso8601] "$request_method $uri" '
                        '$status $body_bytes_sent $request_time';

upstream binarystudio_app {
    server 127.0.0.1:8421;
    keepalive 16;
}

# Anything that does not name the site: no certificate, no response.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name binarystudio.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name binarystudio.example.com;

    ssl_certificate     /etc/letsencrypt/live/binarystudio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/binarystudio.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:binarystudio_tls:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/binarystudio.access.log binarystudio;
    # nginx's error log quotes the full request line, query string included, in
    # every message at level "error" and below (upstream timeouts, limit_req and
    # limit_conn refusals, client aborts), and that cannot be reformatted. "crit"
    # keeps those lines, and so any document id still sent in a query, out of the
    # log; the app's own log has each refused or failed request with the id
    # redacted. Lower the level only while debugging, and treat that log as secret.
    error_log /var/log/nginx/binarystudio.error.log crit;
    server_tokens off;

    # A little above the app's upload limit (32 MiB by default), so the app's
    # JSON error is what a user sees for a file that is slightly too large.
    client_max_body_size  33m;
    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          60s;
    keepalive_timeout     60s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        limit_req  zone=binarystudio_req burst=60 nodelay;
        limit_conn binarystudio_conn 24;

        proxy_pass http://binarystudio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # REQUIRED. Without this nginx sends "Host: binarystudio_app": the app
        # then refuses every request (Host allowlist) and every upload (Origin
        # must match Host).
        proxy_set_header Host $host;

        # REQUIRED with --trust-proxy. The app believes the LAST address in
        # X-Forwarded-For; overwrite the header rather than appending to
        # whatever the client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx receives the whole upload before the app sees any of it, so a
        # slow client occupies nginx, not one of the app's request threads.
        proxy_request_buffering on;
        proxy_buffering on;

        proxy_connect_timeout 3s;
        proxy_send_timeout    60s;
        proxy_read_timeout    90s;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://binarystudio_app;
        proxy_set_header Host $host;
    }
}
